<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Mobile</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
header{background:#1d4ed8;padding:15px 25px}
.hero{padding:90px;text-align:center;background:linear-gradient(#0006,#000b),url("https://images.unsplash.com/photo-1511707171634-5f897ff02aa9") center/cover}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:40px}
.card{background:#1e293b;padding:15px;border-radius:10px}
.card img{width:100%;height:200px;object-fit:cover;border-radius:8px}
footer{text-align:center;padding:20px;background:#020617}
</style></head>
<body>
<header>📱 Smart Mobile</header>
<section class="hero"><h1>Latest Phones</h1></section>
<div class="grid">
<div class="card"><img src="https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5"><h3>Flagship</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1598327105666-5b89351aff97"><h3>Budget</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1580910051074-3eb694886505"><h3>Pro</h3></div>
</div>
<footer>© Smart Mobile</footer>
</body></html>
